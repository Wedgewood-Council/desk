<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wedgewood Council Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Manrope:wght@600;700;800&display=swap">
<style>
/* Layout: a council "desk" — sticky header with four tabs; Overview leads with what is late, then lists. */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --sunk:#e8edeb; --line:#d3dbd8;
  --fg:#17211f; --muted:#5a6966;
  --accent:#1d5c56; --accent-fg:#ffffff; --accent-soft:#d9ebe8;
  --late:#b3261e; --late-soft:#fbe4e1; --soon:#8a5a00; --soon-soft:#fbefd6; --ok:#2f6b34; --ok-soft:#dff0df; --pm:#5a47b8; --pm-soft:#ece9fb;
  --display:"Manrope",system-ui,sans-serif; --body:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111816; --surface:#18211f; --sunk:#202b28; --line:#2e3c39; --fg:#e4ecea; --muted:#9aaba7;
  --accent:#6cc0b5; --accent-fg:#0b1513; --accent-soft:#1f3a36;
  --late:#ff8a80; --late-soft:#3d1d1b; --soon:#f0c060; --soon-soft:#3a2f14; --ok:#8fd394; --ok-soft:#1d3320; --pm:#b8adf7; --pm-soft:#29243f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111816; --surface:#18211f; --sunk:#202b28; --line:#2e3c39; --fg:#e4ecea; --muted:#9aaba7;
  --accent:#6cc0b5; --accent-fg:#0b1513; --accent-soft:#1f3a36;
  --late:#ff8a80; --late-soft:#3d1d1b; --soon:#f0c060; --soon-soft:#3a2f14; --ok:#8fd394; --ok-soft:#1d3320; --pm:#b8adf7; --pm-soft:#29243f; color-scheme:dark}
*{box-sizing:border-box}
html{color-scheme:light}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 8px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column}
.brand h1{font-family:var(--display);font-size:20px;font-weight:800;margin:0;letter-spacing:-.01em}
.brand span{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
nav{display:flex;gap:4px;overflow-x:auto;padding-bottom:0}
nav a{padding:10px 14px;color:var(--muted);text-decoration:none;font-weight:500;border-bottom:3px solid transparent;white-space:nowrap}
nav a[aria-current="page"]{color:var(--fg);border-bottom-color:var(--accent)}
nav a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.badge-n{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:10px;background:var(--late);color:#fff;font-size:12px;text-align:center;font-variant-numeric:tabular-nums}
main{padding-block:20px 60px}
.notice{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 14px;border-radius:8px;background:var(--accent-soft);margin-bottom:18px;font-size:14px}
.notice.warn{background:var(--soon-soft)}
h2{font-family:var(--display);font-size:22px;margin:0;text-wrap:balance;letter-spacing:-.01em}
h3{font-family:var(--display);font-size:16px;margin:0 0 10px}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.sub{color:var(--muted);margin:4px 0 0;font-size:14px}
button,.btn{font:inherit;font-weight:500;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:8px 14px;border-radius:6px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
button.small{padding:4px 10px;font-size:13px}
button.link{font:inherit;text-align:left;border:none;background:none;padding:0;color:var(--accent);text-decoration:underline;cursor:pointer}
button.danger{color:var(--late);border-color:var(--late)}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:24px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.tile b{display:block;font-family:var(--display);font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
.tile span{font-size:13px;color:var(--muted)}
.tile.late b{color:var(--late)}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px}
.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;padding:12px 0;border-top:1px solid var(--line);align-items:start}
.row:first-child{border-top:none;padding-top:0}
.row .title{font-weight:600;overflow-wrap:anywhere}
.row .meta{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px}
.row .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.row .notes{grid-column:1/-1;font-size:14px;color:var(--fg);white-space:pre-wrap;overflow-wrap:anywhere}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:10px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.late{background:var(--late-soft);color:var(--late)}
.pill.soon{background:var(--soon-soft);color:var(--soon)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.pill.ex{background:transparent;border:1px dashed var(--line)}
.date{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.filters select,.filters input{font:inherit;font-size:14px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg)}
.empty{padding:24px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:8px}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.col{background:var(--sunk);border-radius:8px;padding:10px;min-width:0}
.col h3{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:flex;justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px;margin-top:8px;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.card:hover{border-color:var(--accent)}
.card .t{font-weight:600;font-size:14px;overflow-wrap:anywhere}
.card .m{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.pm-card{display:flex;flex-wrap:wrap;gap:8px 24px;align-items:center}
.pm-card .v{font-family:var(--mono);font-size:14px;user-select:all}
.kv{display:flex;flex-direction:column}
.kv small{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.method{font-family:var(--mono);font-size:12px;padding:1px 6px;border-radius:4px;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
.tscroll{overflow-x:auto}
.load{display:flex;align-items:center;gap:10px}
.bar{height:8px;border-radius:4px;background:var(--accent);min-width:2px}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(10,20,18,.45);z-index:20;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 40px) max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);border-radius:10px;width:100%;max-width:520px;padding:20px;border:1px solid var(--line)}
.modal h2{margin-bottom:14px}
.form{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.form .full{grid-column:1/-1}
.form label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:500;color:var(--muted)}
.form input,.form select,.form textarea{font:inherit;font-size:15px;color:var(--fg);padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);min-width:0;max-width:100%}
.form textarea{min-height:80px;resize:vertical}
.form .check{flex-direction:row;align-items:center;gap:8px;color:var(--fg)}
.modal-acts{display:flex;gap:8px;justify-content:space-between;margin-top:18px;flex-wrap:wrap}
.modal-acts div{display:flex;gap:8px}
pre.draft{white-space:pre-wrap;font-family:var(--body);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:12px;font-size:14px;max-height:50vh;overflow:auto}
.attach{border:1px dashed var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px}
.attach.drag{border-color:var(--accent);background:var(--accent-soft)}
.attach-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.btn.small{padding:4px 10px;font-size:13px;color:var(--fg);display:inline-block}
.frow{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:8px;align-items:center;font-size:14px}
.frow .fmain{display:flex;flex-direction:column;min-width:0}
.frow .fmain a{color:var(--accent);overflow-wrap:anywhere}
.frow .meta{font-size:12px;color:var(--muted)}
.ficon{font-family:var(--mono);font-size:10px;font-weight:500;padding:4px 5px;border-radius:4px;background:var(--sunk);color:var(--muted);min-width:34px;text-align:center}
.frow select{font:inherit;font-size:12px;padding:3px 4px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--fg)}
.modal.wide{max-width:760px}
.review{display:flex;flex-direction:column;gap:10px;max-height:60vh;overflow-y:auto;padding-right:4px}
.rv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.rv.off{opacity:.55}
.rv input[type=checkbox]{width:18px;height:18px;margin-top:8px;accent-color:var(--accent)}
.rv-main{display:flex;flex-direction:column;gap:6px;min-width:0}
.rv-title{font:inherit;font-weight:600;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg);width:100%}
.rv-fields{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.rv-fields select,.rv-fields input{font:inherit;font-size:13px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg)}
.rv-src{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
@media (max-width:520px){.frow{grid-template-columns:auto minmax(0,1fr)}.frow select,.frow>span:last-child{grid-column:2}}
.bell-wrap{position:relative}
.bell{position:relative;display:inline-flex;align-items:center;padding:6px 9px}
.bell-count{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--late);color:#fff;font-size:11px;font-weight:600;line-height:18px;text-align:center;font-variant-numeric:tabular-nums}
.bell-panel{position:absolute;right:0;top:calc(100% + 8px);width:min(400px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 32px rgba(10,20,18,.18);z-index:15;display:flex;flex-direction:column;max-height:min(70vh,560px)}
.np-head{display:flex;justify-content:space-between;align-items:center;padding:12px 14px 6px}
.np-tabs{display:flex;gap:4px;padding:4px 10px 8px;border-bottom:1px solid var(--line)}
.np-tabs button{font-size:13px;padding:4px 10px;border-radius:14px;border:1px solid transparent;background:none;color:var(--muted)}
.np-tabs button[aria-selected="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.np-list{overflow-y:auto}
.np-item{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:start;border-bottom:1px solid var(--line)}
.np-item:last-child{border-bottom:none}
.np-main{display:grid;grid-template-columns:10px minmax(0,1fr);gap:10px;text-align:left;border:none;border-radius:0;background:none;padding:10px 4px 10px 14px;font-weight:400;font-size:14px;color:var(--muted);width:100%}
.np-item.unread .np-main{color:var(--fg)}
.np-item.unread{background:color-mix(in srgb, var(--accent-soft) 45%, transparent)}
.np-dot{width:8px;height:8px;border-radius:50%;margin-top:6px;background:transparent}
.np-item.unread .np-dot{background:var(--accent)}
.np-item.late.unread .np-dot{background:var(--late)}
.np-text{overflow-wrap:anywhere}
.np-meta{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.np-toggle{border:none;background:none;color:var(--accent);padding:10px 14px;font-size:12px}
.discuss{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:12px}
.comments{display:flex;flex-direction:column;gap:10px;max-height:260px;overflow-y:auto}
.cm{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px}
.cm-head{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;margin-bottom:2px;font-size:13px}
.cm-head .meta{color:var(--muted);font-size:12px}
.cm-acts{margin-left:auto;font-size:12px}
.cm-body{white-space:pre-wrap;overflow-wrap:anywhere}
.composer{display:flex;flex-direction:column;gap:6px}
.composer textarea{min-height:60px}
.composer-row{display:flex;justify-content:space-between;gap:8px}
.composer-row select{font-size:13px;padding:4px 6px}
.mention-wrap{position:relative;display:block}
.mention-wrap textarea{width:100%}
.mention-pop{position:absolute;left:0;top:100%;margin-top:4px;z-index:25;min-width:220px;max-width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(10,20,18,.18);display:flex;flex-direction:column;padding:4px}
.mention-pop button{display:flex;justify-content:space-between;gap:12px;border:none;background:none;text-align:left;padding:6px 10px;border-radius:6px;font-size:14px;color:var(--fg)}
.mention-pop button span{color:var(--muted);font-size:12px}
.mention-pop button[aria-selected="true"]{background:var(--accent-soft)}
.mention{color:var(--accent);font-weight:600;background:var(--accent-soft);border-radius:4px;padding:0 3px}
.mention.me{background:var(--soon-soft);color:var(--soon)}
.pm-tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--pm);background:var(--pm-soft);border:1px solid var(--pm);border-radius:4px;padding:0 5px;vertical-align:1px}
.card .pm-tag{align-self:flex-start}
.card.pm-card-task{background:var(--pm-soft);border-color:var(--pm);border-style:dashed}
.card.pm-card-task:hover{border-style:solid}
.row.pm-row .title{color:var(--fg)}
.votes{display:flex;flex-direction:column;gap:14px}
.vote{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px}
.vote.closed{background:var(--bg)}
.vote-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.vote-head h3{margin:0 0 4px;font-size:17px;overflow-wrap:anywhere}
.vote-head .meta{font-size:13px;color:var(--muted)}
.pill.big{font-size:13px;padding:3px 10px}
.vote-details{font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--fg)}
.ballot{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ballot button:not(.link){min-width:96px;font-weight:600}
.ov-vote{padding:12px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.ov-vote:first-child{border-top:none;padding-top:0}
.ov-vote .ballot button:not(.link){min-width:0;padding:5px 12px;font-size:13px}
.row.clickable{cursor:pointer;border-radius:6px}
.you-tag{font-weight:400;font-size:13px;color:var(--muted)}
.ov-vote .meta,.mp-task .meta{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;margin-top:4px}
.mp-flag .meta{font-size:13px;color:var(--muted)}
.row.clickable:hover .title,.row.clickable:focus-visible .title{color:var(--accent);text-decoration:underline}
.mp-flag{background:var(--soon-soft);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:14px}
.mp-flag h3{font-size:14px;margin:0 0 6px}
.mp-task{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.mp-task select{font:inherit;font-size:13px;padding:5px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
.mp-task .acts{display:flex;gap:6px;align-items:center}
.vote.flash{outline:3px solid var(--accent);outline-offset:2px;transition:outline-color 1.5s}
@media (max-width:520px){.mp-task{grid-template-columns:minmax(0,1fr)}}
.ballot button.chosen{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.tally{display:flex;flex-direction:column;gap:6px}
.trow{display:grid;grid-template-columns:minmax(70px,max-content) minmax(60px,1fr) 2ch minmax(0,1.2fr);gap:10px;align-items:center;font-size:13px}
.tl{font-weight:600;overflow-wrap:anywhere}
.tbar{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.tbar span{display:block;height:100%;background:var(--accent);border-radius:4px}
.tn{font-variant-numeric:tabular-nums;text-align:right;font-weight:600}
.tw{color:var(--muted);overflow-wrap:anywhere}
.vote-foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line);padding-top:10px}
.vote-foot .meta{font-size:13px;color:var(--muted)}
.vote-acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
a.btn{text-decoration:none}
@media (max-width:520px){.trow{grid-template-columns:minmax(60px,max-content) minmax(40px,1fr) 2ch}.tw{grid-column:1/-1;margin-top:-4px}}
.ctr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.ctr{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.ctr.avoid{opacity:.75}
.ctr-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ctr-head h3{margin:0 0 2px;font-size:16px;overflow-wrap:anywhere}
.ctr-head .meta{font-size:13px;color:var(--muted)}
.ctr-contact{display:flex;flex-wrap:wrap;gap:6px 22px}
.ctr-contact .v{font-family:var(--mono);font-size:13px;color:var(--fg);overflow-wrap:anywhere}
.ctr-contact a.v{color:var(--accent)}
.ctr-stats{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--muted)}
.ctr-acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.filters input[type=search]{min-width:220px;flex:1 1 220px}
.sub-block{border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px}
.pc-list,.q-list{display:flex;flex-direction:column;gap:8px}
.pc-row{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1.3fr) auto;gap:6px}
.pc-row input{font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);min-width:0}
.q-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:10px;align-items:center;font-size:14px}
.q-row .fmain{display:flex;flex-direction:column;min-width:0}
.q-row .meta{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.q-row .meta a{color:var(--accent)}
.q-row select{font:inherit;font-size:12px;padding:3px 4px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--fg)}

.q-form{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-top:10px}

.toast-act{margin-left:14px;background:none;border:none;color:inherit;text-decoration:underline;font-weight:600;padding:0;cursor:pointer}
.theme-btn{display:inline-flex;align-items:center;gap:6px}
.history{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:14px}
.history li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 20px);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:6px;z-index:30;font-size:14px}
.auth{min-height:80vh;display:flex;align-items:center;justify-content:center;padding-block:40px}
.auth-box{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:28px;width:100%;max-width:400px;display:flex;flex-direction:column;gap:14px}
.auth-box h1{font-family:var(--display);font-size:22px;margin:0}
.auth-box .form{grid-template-columns:1fr}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:10px}
.divider{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.err{color:var(--late);font-size:14px;margin:0}
.userchip{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.top-right{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
@media (max-width:820px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:minmax(0,1fr)}.board{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.board{grid-template-columns:minmax(0,1fr)}.form{grid-template-columns:1fr}.row{grid-template-columns:minmax(0,1fr)}.row .acts{justify-content:flex-start}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<script>
(() => {
const STATUSES = [["todo","To do"],["doing","In progress"],["waiting","Waiting on PM"],["done","Done"]];
const CATEGORIES = ["Maintenance","Repairs","Landscaping","Finance","Insurance","Bylaws","AGM / meetings","Other"];
const ROLES = ["President","Vice President","Treasurer","Secretary","Member"];
const roleName = r => r === "Member at large" ? "Member" : (r || "");
const S = { contractors:[], ownerEmail:"", votes:[], ballots:[], members:[], tasks:[], contacts:[], comments:[], activity:[], pm:{}, mode:"loading", readOnly:false, loaded:{} };
let db = null;

/* ---------- helpers ---------- */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => iso(new Date());
const addDays = (s, n) => { const d = s ? new Date(s+"T12:00:00") : new Date(); d.setDate(d.getDate()+n); return iso(d); };
const daysBetween = (a, b) => Math.round((new Date(b+"T12:00:00") - new Date(a+"T12:00:00")) / 86400000);
const fmt = s => { if(!s) return "—"; const d = new Date(s+"T12:00:00"); return d.toLocaleDateString(undefined,{month:"short",day:"numeric",year: d.getFullYear()===new Date().getFullYear()?undefined:"numeric"}); };
const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
const member = id => S.members.find(m => m.id === id);
const memberName = id => { if(id === "pm") return "Property Manager"; const m = member(id); if(!m) return "Unassigned"; return m.name + (m.active === false ? " (former)" : ""); };
const activeMembers = () => S.members.filter(m => m.active !== false).sort((a,b)=>a.name.localeCompare(b.name));
const statusLabel = k => (STATUSES.find(s=>s[0]===k)||STATUSES[0])[1];

function dueState(date, done){
  if(done || !date) return null;
  const d = daysBetween(today(), date);
  if(d < 0) return {cls:"late", text: `${-d} day${d===-1?"":"s"} overdue`};
  if(d === 0) return {cls:"soon", text:"Due today"};
  if(d <= 7) return {cls:"soon", text:`Due in ${d} day${d===1?"":"s"}`};
  return null;
}
const taskLate = t => t.status !== "done" && t.due && t.due < today();
const fuOpen = c => c.followUpDate && !c.followUpDone;
const chases = c => (c.history||[]).filter(h=>h.type==="chase").length;
const fuLate = c => fuOpen(c) && c.followUpDate < today();
const orphaned = t => t.status !== "done" && t.ownerId !== "pm" && (!t.ownerId || member(t.ownerId)?.active === false || !member(t.ownerId));

let toastTimer;
function toast(msg, action){
  let el=$(".toast"); if(!el){el=document.createElement("div");el.className="toast";el.setAttribute("role","status");document.body.appendChild(el);}
  el.textContent=msg;
  if(action){ const b=document.createElement("button"); b.className="toast-act"; b.type="button"; b.textContent=action.label; b.onclick=()=>{ el.remove(); action.fn(); }; el.appendChild(b); }
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.remove(), action ? 7000 : 2600);
}

/* ---------- Firebase: sign-in and shared database ---------- */
const CFG = window.COUNCIL_CONFIG || {};
let fdb = null, auth = null, me = null, unsubs = [];
const lc = s => String(s||"").trim().toLowerCase();

const demo = () => S.mode === "demo";
function demoPut(coll, id, data){
  if(coll === "settings"){ if(id === "ownership") S.ownerEmail = lc(data.ownerEmail); else S.pm = {...data}; return; }
  if(coll === "access") return;
  const arr = S[coll]; const i = arr.findIndex(x=>x.id===id); const rec = {...data, id};
  if(i>=0) arr[i]=rec; else arr.push(rec);
}
const store = {
  async set(coll, id, data){
    if(demo()){ demoPut(coll, id, data); render(); return true; }
    try { await fdb.collection(coll).doc(id).set(data); return true; }
    catch(e){ handleWriteError(e); return false; }
  },
  async del(coll, id){
    if(demo()){
      if(coll === "tasks" || coll === "contractors") (S[coll].find(t=>t.id===id)?.files||[]).forEach(f=>files.remove(f));
      S[coll] = S[coll].filter(x=>x.id!==id); render(); return true;
    }
    try {
      if(coll === "members"){
        const m = member(id); const b = fdb.batch();
        b.delete(fdb.collection("members").doc(id));
        if(m && m.email) b.delete(fdb.collection("access").doc(lc(m.email)));
        await b.commit();
      } else {
        if(coll === "tasks" || coll === "contractors") for(const f of (S[coll].find(t=>t.id===id)?.files||[])) await files.remove(f);
        await fdb.collection(coll).doc(id).delete();
      }
      return true;
    } catch(e){ handleWriteError(e); return false; }
  },
  /* Several writes that must land together (e.g. a batch of tasks from minutes). */
  async many(writes){
    if(demo()){ writes.forEach(w => demoPut(w.coll, w.id, w.data)); render(); return true; }
    const b = fdb.batch(); writes.forEach(w => b.set(fdb.collection(w.coll).doc(w.id), w.data));
    try { await b.commit(); return true; } catch(e){ handleWriteError(e); return false; }
  },
  /* A member's email is their key to sign in, so saving a member also updates the access list. */
  async saveMember(id, data, prev){
    data.email = lc(data.email);
    if(demo()){ demoPut("members", id, data); render(); return true; }
    const b = fdb.batch();
    b.set(fdb.collection("members").doc(id), data);
    const old = lc(prev && prev.email);
    if(old && old !== data.email) b.delete(fdb.collection("access").doc(old));
    if(data.email) b.set(fdb.collection("access").doc(data.email), {active: data.active !== false, memberId: id});
    try { await b.commit(); return true; } catch(e){ handleWriteError(e); return false; }
  }
};

/* ---------- attachments: Firebase Storage, or in-memory files in the preview ---------- */
const MAX_FILE = 25 * 1024 * 1024;
const FILE_LABELS = ["Quote","Invoice","Correspondence","Minutes","Photo","Report","Contract","Other"];
function guessLabel(name){
  const n = name.toLowerCase();
  if(/quote|estimate|proposal/.test(n)) return "Quote";
  if(/invoice|receipt|bill/.test(n)) return "Invoice";
  if(/minutes|agenda/.test(n)) return "Minutes";
  if(/\.(jpe?g|png|heic|gif|webp)$/.test(n)) return "Photo";
  if(/\.(eml|msg)$|email|letter|reply/.test(n)) return "Correspondence";
  if(/contract|agreement/.test(n)) return "Contract";
  if(/report|inspection/.test(n)) return "Report";
  return "Other";
}
const fmtSize = b => b < 1024*1024 ? `${Math.max(1,Math.round(b/1024))} KB` : `${(b/1024/1024).toFixed(1)} MB`;
const files = {
  async upload(taskId, file, onProgress, coll="tasks"){
    const id = uid(); const safe = file.name.replace(/[^\w.\- ]+/g, "_").slice(-120);
    const meta = {id, name:file.name, size:file.size, type:file.type||"", label:guessLabel(file.name), addedBy: myMemberId(), addedAt: today()};
    if(demo()){ meta.url = URL.createObjectURL(file); meta.path = ""; onProgress && onProgress(1); return meta; }
    const path = `${coll}/${taskId}/${id}-${safe}`;
    const task = firebase.storage().ref(path).put(file, {contentType: file.type || "application/octet-stream"});
    await new Promise((res, rej) => task.on("state_changed", s => onProgress && onProgress(s.bytesTransferred / s.totalBytes), rej, res));
    meta.path = path; meta.url = await task.snapshot.ref.getDownloadURL();
    return meta;
  },
  async remove(f){
    if(demo() || !f.path){ if(f.url && f.url.startsWith("blob:")) URL.revokeObjectURL(f.url); return; }
    try { await firebase.storage().ref(f.path).delete(); } catch(e){ if(e.code !== "storage/object-not-found") throw e; }
  }
};
function myMemberId(){
  if(demo()) return activeMembers()[0]?.id || "";
  const m = S.members.find(x => lc(x.email) === lc(me && me.email)); return m ? m.id : "";
}
function handleWriteError(e){
  console.error(e);
  if(e && e.code === "permission-denied") toast("You don't have permission to make that change.");
  else toast("That change didn't save. Check your connection and try again.");
}

  "auth/user-not-found":"No account uses that email yet. Choose \"First time? Create a password\".",

  "auth/network-request-failed":"Couldn't reach the sign-in service. Check your connection."
};
const authErr = e => AUTH_ERRORS[e && e.code] || "Sign-in didn't work. Try again.";
function showAuth(msgHtml, showForms=true){

function wireAuthScreen(){

    try { await auth.signInWithPopup(p); }
    catch(e){ if(e.code === "auth/popup-blocked" || e.code === "auth/operation-not-supported-in-this-environment") await auth.signInWithRedirect(p); else showAuth(`<p class="err">${esc(authErr(e))}</p>`); }

  };
  $("#resetBtn").onclick = async () => {

    showAuth(`<div class="notice">If ${esc(email)} has an account, a reset link is on its way. Check your inbox.</div>`);
  };
  $("#signOut").onclick = () => auth.signOut();
}

/* ---------- light / dark ---------- */
const THEME_NAMES = {system:"Auto", light:"Light", dark:"Dark"};
const THEME_ICONS = {
  system:'<svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.5a6.5 6.5 0 0 1 0 13z" fill="currentColor"/></svg>',
  light:'<svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3.2" fill="currentColor"/><g stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M8 .8v2M8 13.2v2M.8 8h2M13.2 8h2M2.9 2.9l1.4 1.4M11.7 11.7l1.4 1.4M2.9 13.1l1.4-1.4M11.7 4.3l1.4-1.4"/></g></svg>',
  dark:'<svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 10.2A6 6 0 0 1 5.8 2.5a6 6 0 1 0 7.7 7.7z" fill="currentColor"/></svg>'
};
let theme = "system";
function applyTheme(t, fromUser){
  theme = t;
  if(t === "system"){ if(fromUser) document.documentElement.removeAttribute("data-theme"); }
  else document.documentElement.setAttribute("data-theme", t);
  const b = $("#themeBtn"); b.innerHTML = THEME_ICONS[t] + "<span>" + THEME_NAMES[t] + "</span>";
  b.setAttribute("aria-label", `Theme: ${THEME_NAMES[t]}. Click to change.`);
}
function wireTheme(){
  let saved = "system"; try { saved = localStorage.getItem("wcd-theme") || "system"; } catch(e){}
  applyTheme(THEME_NAMES[saved] ? saved : "system", false);
  $("#themeBtn").onclick = () => {
    const next = {system:"light", light:"dark", dark:"system"}[theme];
    applyTheme(next, true); try { localStorage.setItem("wcd-theme", next); } catch(e){}
    toast(next === "system" ? "Theme follows your device" : `${THEME_NAMES[next]} theme`);
  };
}

/* ---------- boot ---------- */
function stopListening(){ unsubs.forEach(u => u()); unsubs = []; S.loaded = {}; }
async function boot(){
  wireTheme();
  if(!window.firebase || !CFG.firebase || !CFG.firebase.apiKey){ startDemo(); return; }
  firebase.initializeApp(CFG.firebase);
  auth = firebase.auth(); fdb = firebase.firestore();
  if(CFG.emulator){ auth.useEmulator(`http://${CFG.emulator}:9099`, {disableWarnings:true}); fdb.useEmulator(CFG.emulator, 8080); if(firebase.storage) firebase.storage().useEmulator(CFG.emulator, 9199); }
  wireAuthScreen();
  auth.getRedirectResult().catch(e => showAuth(`<p class="err">${esc(authErr(e))}</p>`));
  auth.onAuthStateChanged(async user => {
    stopListening(); me = user;
    if(!user){ showAuth(""); return; }
    const email = lc(user.email);
    if(!user.emailVerified){
      showAuth(`<div class="notice"><span>We sent a link to <b>${esc(email)}</b>. Open it to confirm this is your email, then come back here.</span></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="primary" type="button" id="iVerified">I've confirmed it</button><button type="button" id="resend">Send the link again</button><button type="button" id="out1">Use a different account</button></div>`, false);
      $("#iVerified").onclick = async () => { await user.reload(); if(auth.currentUser.emailVerified){ await user.getIdToken(true); location.reload(); } else toast("Not confirmed yet. Check your inbox and spam folder."); };
      $("#resend").onclick = async () => { try{ await user.sendEmailVerification(); toast("Link sent"); }catch(e){ toast(authErr(e)); } };
      $("#out1").onclick = () => auth.signOut();
      return;
    }
    showAuth(`<p class="sub">Checking the council list…</p>`, false);
    let ok = false;
    try {
      const a = await fdb.collection("access").doc(email).get();
      ok = a.exists && a.data().active === true;
      if(!ok && !a.exists){
        /* The first sign-in by the council's owner adds them to the list. The access rules refuse this for anyone else. */
        const id = uid(); const b = fdb.batch();
        b.set(fdb.collection("members").doc(id), {name: user.displayName || email.split("@")[0], role:"President", email, unit:"", phone:"", active:true});
        b.set(fdb.collection("access").doc(email), {active:true, memberId:id});
        b.set(fdb.collection("settings").doc("ownership"), {ownerEmail: email, since: today()});
        await b.commit(); ok = true;
      }
    } catch(e){ ok = false; }
    if(!ok){
      showAuth(`<div class="notice warn"><span><b>${esc(email)}</b> isn't on the council list. Ask a council member to add this email on the Members tab, then sign in again.</span></div>
        <button type="button" id="out2">Sign out</button>`, false);
      $("#out2").onclick = () => auth.signOut(); return;
    }
    startApp();
  });
}
function startDemo(){
  Object.assign(S, demoData(), {mode:"demo", ownerEmail:"alex@example.com"}); S.loaded = {members:1,tasks:1,contacts:1,settings:1};
  $("#authScreen").hidden = true; $("#app").hidden = false;
  $("#whoami").textContent = "Preview"; $("#signOut").hidden = true;
  render();
}
function startApp(){
  $("#authScreen").hidden = true; $("#app").hidden = false;
  $("#whoami").textContent = me.email;
  S.mode = "live"; render();
  const timer = setTimeout(()=>{ if(Object.keys(S.loaded).length < 4){ S.slow = true; renderNotices(); } }, 10000);
  unsubs.push(fdb.collection("contractors").onSnapshot(snap => { S.contractors = snap.docs.map(d=>({...d.data(), id:d.id})); render(); }, err => console.error(err)));
  unsubs.push(fdb.collection("votes").onSnapshot(snap => { S.votes = snap.docs.map(d=>({...d.data(), id:d.id})); render(); }, err => console.error(err)));
  unsubs.push(fdb.collection("ballots").onSnapshot(snap => { S.ballots = snap.docs.map(d=>({...d.data(), id:d.id})); render(); }, err => console.error(err)));
  unsubs.push(fdb.collection("comments").onSnapshot(snap => { S.comments = snap.docs.map(d=>({...d.data(), id:d.id})); render(); }, err => console.error(err)));
  unsubs.push(fdb.collection("activity").orderBy("at","desc").limit(150).onSnapshot(snap => { S.activity = snap.docs.map(d=>({...d.data(), id:d.id})); render(); }, err => console.error(err)));
  unsubs.push(fdb.collection("notif").doc(readsDocId()).onSnapshot(d => { const x = d.exists ? d.data() : {}; reads = {read:x.read||{}, unread:x.unread||{}, allReadBefore:x.allReadBefore||""}; renderBell(); }, err => console.error(err)));
  for(const [coll, key] of [["members","members"],["tasks","tasks"],["contacts","contacts"],["settings","pm"]]){
    unsubs.push(fdb.collection(coll).onSnapshot(snap => {
      if(coll === "settings"){ const d = snap.docs.find(x=>x.id==="pm"); S.pm = d ? d.data() : {}; const o = snap.docs.find(x=>x.id==="ownership"); S.ownerEmail = o ? lc(o.data().ownerEmail) : ""; }
      else S[key] = snap.docs.map(d => ({...d.data(), id:d.id}));
      S.loaded[coll] = true;
      if(Object.keys(S.loaded).length === 4){ clearTimeout(timer); S.slow = false; }
      render();
    }, err => { console.error(err); S.dbError = err.code || "unavailable"; clearTimeout(timer); renderNotices(); }));
  }
}

/* ---------- notices ---------- */
function renderNotices(){
  const n = [];
  if(S.mode === "demo") n.push(`<div class="notice warn"><span><b>Preview with sample data.</b> Try anything. Changes reset when you reload, and nothing is shared until the council's Firebase project is connected.</span></div>`);
  if(S.slow) n.push(`<div class="notice warn"><span>The shared records are taking a while to load. What you see may be out of date.</span></div>`);
  if(S.dbError) n.push(`<div class="notice warn"><span>Lost the connection to the shared records. Reload the page to reconnect.</span></div>`);
  if(S.mode==="live" && Object.keys(S.loaded).length===4 && !S.tasks.length && !S.contacts.length && !(S.pm.email||S.pm.phone))
    n.push(`<div class="notice"><span><b>Welcome.</b> The tracker is empty. Start by adding council members on the Members tab, then add tasks and log Property Manager contacts as they happen.</span></div>`);
  if(hasExamples() && !demo()) n.push(`<div class="notice"><span>Some records are <span class="pill ex">Example</span> data to show how it works. Remove them when you're ready to add the real council.</span><span style="display:flex;gap:6px;flex-wrap:wrap"><button class="small" data-act="clear-examples">Remove example data</button></span></div>`);

const VIEWS = ["overview","tasks","pm","votes","contractors","members"];
const currentView = () => { const h = location.hash.slice(1); return VIEWS.includes(h) ? h : "overview"; };

function viewOverview(){

function viewTasks(){

  if(filt.owner) ts = ts.filter(t => filt.owner==="none" ? orphaned(t) : t.ownerId===filt.owner);

  ts.sort((a,b)=>(a.due||"9999").localeCompare(b.due||"9999"));
  const filters = `<div class="filters" data-filter-root>
    <select id="fOwner" aria-label="Filter by owner"><option value="">Everyone</option><option value="none" ${filt.owner==="none"?"selected":""}>No owner</option><option value="pm" ${filt.owner==="pm"?"selected":""}>Property Manager</option>${S.members.map(m=>`<option value="${m.id}" ${filt.owner===m.id?"selected":""}>${esc(memberName(m.id))}</option>`).join("")}</select>

  else body = `<div class="board">${STATUSES.map(([k,label]) => { const col = ts.filter(t=>(t.status||"todo")===k); return `<div class="col"><h3><span>${label}</span><span>${col.length}</span></h3>${col.map(t=>{const ds=dueState(t.due,t.status==="done");return `<div class="card ${isPmTask(t)?"pm-card-task":""}" ${ro()?"":`data-act="edit-task" data-id="${t.id}" role="button" tabindex="0"`}>${isPmTask(t)?'<span class="pm-tag">PM task</span>':""}<div class="t">${esc(t.title)}</div><div class="m"><span>${esc(memberName(t.ownerId))}</span><span class="date">${fmt(t.due)}</span>${ds?`<span class="pill ${ds.cls}">${ds.text}</span>`:""}${t.category?`<span class="pill">${esc(t.category)}</span>`:""}${t.contractorId && contractor(t.contractorId)?`<span class="pill" title="Contractor">${esc(contractor(t.contractorId).company)}</span>`:""}${(t.files||[]).length?`<span class="pill" title="Documents">${clip}${t.files.length}</span>`:""}${cmCount(t)}${exPill(t)}</div></div>`}).join("")}</div>`; }).join("")}</div>`;

function viewMembers(){

const MONTHS = ["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"];
const WEEKDAYS = ["sunday","monday","tuesday","wednesday","thursday","friday","saturday"];
const NUMWORDS = {one:1,two:2,three:3,four:4,five:5,six:6,a:1};
const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
function parseDue(line, base){
  const b = new Date(base+"T12:00:00");
  const pre = "(?:\\b(?:by|before|on|no later than|due)\\s+(?:the\\s+)?)?";
  const tries = [
    [new RegExp(pre+"(\\d{4})-(\\d{2})-(\\d{2})","i"), m => `${m[1]}-${m[2]}-${m[3]}`],
    [new RegExp(pre+"\\b("+MONTHS.join("|")+")[a-z]*\\.?\\s+(\\d{1,2})(?:st|nd|rd|th)?(?:,?\\s*(\\d{4}))?\\b","i"), m => monthDay(MONTHS.indexOf(m[1].toLowerCase().slice(0,3)), +m[2], m[3])],
    [new RegExp(pre+"\\b(\\d{1,2})(?:st|nd|rd|th)?\\s+(?:of\\s+)?("+MONTHS.join("|")+")[a-z]*\\.?(?:,?\\s*(\\d{4}))?\\b","i"), m => monthDay(MONTHS.indexOf(m[2].toLowerCase().slice(0,3)), +m[1], m[3])],
    [new RegExp("\\b(?:within|in)\\s+(\\d+|one|two|three|four|five|six|a)\\s+(day|week|month)s?\\b","i"), m => { const n = NUMWORDS[m[1].toLowerCase()] || +m[1]; return addDays(base, m[2].toLowerCase()==="day"?n:m[2].toLowerCase()==="week"?n*7:n*30); }],
    [new RegExp(pre+"\\b(?:the\\s+)?(?:next|following)\\s+(?:council\\s+)?meeting\\b","i"), () => addDays(base, 28)],
    [new RegExp(pre+"\\bend of (?:the )?month\\b","i"), () => iso(new Date(b.getFullYear(), b.getMonth()+1, 0))],
    [new RegExp(pre+"\\bend of (?:the )?week\\b","i"), () => addDays(base, (5 - b.getDay() + 7) % 7 || 7)],
    [new RegExp(pre+"\\bnext week\\b","i"), () => addDays(base, 7)],
    [new RegExp(pre+"\\btomorrow\\b","i"), () => addDays(base, 1)],
    [new RegExp("\\b(?:asap|as soon as possible|immediately)\\b","i"), () => addDays(base, 3)],
    [new RegExp(pre+"\\b(?:this |next )?("+WEEKDAYS.join("|")+")\\b","i"), m => addDays(base, ((WEEKDAYS.indexOf(m[1].toLowerCase()) - b.getDay() + 7) % 7) || 7)],
  ];
  function monthDay(mo, d, y){
    let yr = y ? +y : b.getFullYear(); let dt = new Date(yr, mo, d, 12);
    if(!y && dt < b) dt = new Date(yr+1, mo, d, 12);
    return iso(dt);
  }
  for(const [re, fn] of tries){ const m = line.match(re); if(m) return {due: fn(m), phrase: m[0]}; }
  return {due:"", phrase:""};
}
function guessCategory(l){
  const t = l.toLowerCase();
  if(/budget|invoice|fund|levy|fee|financ|account|audit/.test(t)) return "Finance";
  if(/insur|claim|deductible/.test(t)) return "Insurance";
  if(/bylaw|rule|fine/.test(t)) return "Bylaws";
  if(/landscap|garden|tree|lawn|leaves|snow/.test(t)) return "Landscaping";
  if(/agm|minutes|meeting|agenda|notice/.test(t)) return "AGM / meetings";
  if(/repair|replace|quote|gate|leak|roof|motor|elevator|contractor/.test(t)) return "Repairs";
  if(/clean|inspect|maint|service|gutter/.test(t)) return "Maintenance";
  return "Other";
}
function extractActions(text, base){
  const mem = activeMembers();
  const roles = {president:"President","vice president":"Vice President",treasurer:"Treasurer",secretary:"Secretary"};
  const namePats = mem.flatMap(m => [m.name, m.name.split(/\s+/)[0]]).filter(Boolean).sort((a,b)=>b.length-a.length).map(escRe);
  const whoAlt = [...namePats, "the\\s+(?:vice\\s+president|president|treasurer|secretary)", "vice\\s+president","president","treasurer","secretary","pm","property\\s+manager(?:\\s+\\(pm\\))?","council"].join("|");
  const whoRe = new RegExp(`^(${whoAlt})\\s+(?:to|will|shall|agreed to|is to|has agreed to|volunteered to|needs to)\\s+`, "i");
  const trailRe = /\(\s*(?:action|owner|assigned(?: to)?|lead)\s*[:\-]?\s*([^)]+)\)\s*\.?\s*$/i;
  const prefRe = /^(?:action items?|action|todo|to-do|to do|task|follow[- ]?up|next steps?)\s*[:\-–—]\s*/i;
  function resolve(who){
    if(!who) return {ownerId:"", pm:false};
    const w = who.toLowerCase().replace(/^the\s+/,"").replace(/\s+/g," ").trim();
    if(/^(pm|property manager)/.test(w)) return {ownerId:"", pm:true};
    if(roles[w]){ const m = mem.find(x=>x.role===roles[w]); return {ownerId: m?m.id:"", pm:false}; }
    const m = mem.find(x => x.name.toLowerCase()===w) || mem.find(x => x.name.split(/\s+/)[0].toLowerCase()===w.split(" ")[0]);
    return {ownerId: m?m.id:"", pm:false};
  }
  const lines = text.replace(/\r/g,"").split(/\n+/).flatMap(l => l.split(/(?<=[a-z0-9)][.;!])\s+(?=[A-Z\[☐□])/));
  const out = []; const seen = new Set();
  for(const raw of lines){
    const r = raw.trim(); if(r.length < 8) continue;
    let l = r; let score = 0;
    if(/^(\[\s?\]|☐|□)/.test(l)){ score += 3; l = l.replace(/^(\[\s?\]|☐|□)\s*/,""); }
    l = l.replace(/^(?:[•\-*–]+|\d+[.)]|[a-z][.)])\s+/i, "");
    const p = l.match(prefRe); if(p){ score += 3; l = l.slice(p[0].length); }
    if(/\bACTION\b/.test(r) && !p) score += 2;
    let who = "";
    const t = l.match(trailRe); if(t){ score += 3; who = t[1]; l = l.replace(trailRe, "").trim(); }
    const w = l.match(whoRe); if(w){ score += 3; who = who || w[1]; }
    if(score === 0 && /\b(needs to be|need to|must be|should be)\b/i.test(l)) score = 1;
    if(score === 0) continue;
    const res = resolve(who);
    if(w) l = l.slice(w[0].length);
    if(!res.ownerId && !res.pm){ const m = mem.find(x => new RegExp(`\\b${escRe(x.name.split(/\s+/)[0])}\\b`, "i").test(l)); if(m && score>=3) res.ownerId = m.id; }
    const d = parseDue(l, base);
    let title = d.phrase ? l.replace(d.phrase, " ") : l;
    title = title.replace(/\s{2,}/g," ").replace(/\s+([.,;])/g,"$1").replace(/[\s.,;:]+$/,"").trim();
    title = title.charAt(0).toUpperCase() + title.slice(1);
    if(title.length < 4 || seen.has(title.toLowerCase())) continue; seen.add(title.toLowerCase());
    out.push({title, ownerId: res.pm ? "pm" : res.ownerId, due: d.due, category: guessCategory(title), status: res.pm ? "waiting" : "todo", source: r, sure: score >= 3});
  }
  return out;
}

async function readMinutesFile(file){

    return f > a ? {cls:"ok", text:`Carried ${f}–${a}`} : f === a ? {cls:"late", text:`Tied ${f}–${a}, defeated`} : {cls:"late", text:`Defeated ${f}–${a}`};
  }
  const top = Math.max(...t.map(x=>x.n)); const winners = t.filter(x=>x.n===top);
  return winners.length > 1 ? {cls:"soon", text:`Tie: ${winners.map(w=>w.o).join(" / ")}`} : {cls:"ok", text:`${winners[0].o} (${top} vote${top===1?"":"s"})`};
}
function voteCard(v){
  const closed = voteClosed(v); const mine = myBallot(v); const tally = voteTally(v);
  const cast = voteBallots(v).length; const eligible = activeMembers().length;
  const notYet = activeMembers().filter(m => !voteBallots(v).some(b=>b.memberId===m.id));
  const max = Math.max(1, ...tally.map(x=>x.n));
  const ds = closed ? null : dueState(v.closesAtIso ? v.closesAtIso.slice(0,10) && new Date(v.closesAtIso).toLocaleDateString("en-CA") : "", false);
  const task = v.taskId ? S.tasks.find(t=>t.id===v.taskId) : null;
  const out = closed ? voteOutcome(v) : null;
  return `<article class="vote ${closed?"closed":""}" id="vote-${v.id}">
    <div class="vote-head">
      <div style="min-width:0"><h3>${esc(v.title)}${exPill(v)}</h3>
        <div class="meta">${v.kind==="choice"?"Choose one":"Motion"} · opened by ${esc(memberName(v.createdBy))} ${v.createdAt?ago(v.createdAt):""} · ${closed ? `closed` : `closes <span class="date">${fmt(new Date(v.closesAtIso).toLocaleDateString("en-CA"))}</span>`}${ds?` <span class="pill ${ds.cls}">${ds.text.replace("Due","Closes")}</span>`:""}${task?` · task: ${esc(task.title)}`:""}</div>
      </div>
      ${out ? `<span class="pill ${out.cls} big">${out.text}</span>` : mine ? `<span class="pill ok">You voted: ${esc(mine.choice)}</span>` : `<span class="pill soon">Your vote needed</span>`}
    </div>
    ${v.details ? `<div class="vote-details">${renderMentions(v.details)}</div>` : ""}
    ${!closed ? `<div class="ballot" role="group" aria-label="Cast your vote">${tally.map(x=>`<button type="button" class="${mine && mine.choice===x.o?"chosen":""}" data-act="cast" data-vid="${v.id}" data-choice="${esc(x.o)}" aria-pressed="${!!(mine && mine.choice===x.o)}">${esc(x.o)}</button>`).join("")}${mine?`<button type="button" class="link" data-act="uncast" data-vid="${v.id}">Withdraw my vote</button>`:""}</div>` : ""}
    <div class="tally">${tally.map(x=>`<div class="trow"><span class="tl">${esc(x.o)}</span><span class="tbar"><span style="width:${Math.round(x.n/max*100)}%"></span></span><span class="tn">${x.n}</span><span class="tw">${x.who.map(id=>esc(id===myMemberId()?"You":memberName(id).split(" ")[0])).join(", ")}</span></div>`).join("")}</div>
    <div class="vote-foot"><span class="meta">${cast} of ${eligible} member${eligible===1?"":"s"} voted${!closed && notYet.length ? ` · waiting on ${notYet.map(m=>esc(m.id===myMemberId()?"you":m.name.split(" ")[0])).join(", ")}` : ""}</span>
      <span class="vote-acts">${canManageVote(v) ? `${!closed?`<button type="button" class="small" data-act="close-vote" data-vid="${v.id}">Close voting now</button>`:""}<button type="button" class="small" data-act="ask-rmvote">Delete</button><span data-confirm hidden><button type="button" class="small danger" data-act="rmvote" data-vid="${v.id}">Delete vote</button> <button type="button" class="small" data-act="cancel-delete">Keep</button></span>` : ""}
      ${closed ? `<button type="button" class="small" data-act="vote-task" data-vid="${v.id}">Create follow-up task</button>` : ""}</span></div>
  </article>`;
}

function logActivity(ev){
  const doc = {...ev, at: nowIso(), byId: myMemberId()};
  Object.keys(doc).forEach(k => doc[k] === undefined && delete doc[k]);
  store.set("activity", uid(), doc).catch(()=>{});
}
let reads = {read:{}, unread:{}, allReadBefore:""};
function readsDocId(){ return demo() ? "preview" : lc(me && me.email); }
function saveReads(){
  // keep the map small: anything older than allReadBefore no longer needs an entry
  for(const k of Object.keys(reads.read)) if(!notifIndex[k] || (reads.allReadBefore && notifIndex[k].at <= reads.allReadBefore)) delete reads.read[k];
  if(demo()){ renderBell(); return; }
  fdb.collection("notif").doc(readsDocId()).set(reads).catch(e => console.error(e));
  renderBell();
}
let notifIndex = {};
function buildNotifications(){
  const mine = myMemberId(); const out = [];
  const nameOf = id => id===mine ? "You" : memberName(id);
  for(const a of S.activity){
    const t = a.taskId ? S.tasks.find(x=>x.id===a.taskId) : null;
    const forMe = a.byId !== mine && ((a.forIds||[]).includes(mine) || (t && t.ownerId === mine));
    const tagged = (a.mentions||[]).includes(mine) && a.byId !== mine;
    const mentioned = tagged && (a.type === "comment" || a.type === "mention");
    out.push({voteId:a.voteId, id:"a:"+a.id, at:a.at, own: a.byId===mine, forMe, mentioned, kind:a.type, text:`<b>${esc(nameOf(a.byId))}</b> ${esc(tagged && a.textYou ? a.textYou : a.text)}`, taskId:a.taskId, contactId:a.contactId});
  }
  // reminders the app works out from dates
  for(const v of votesAwaitingMe()) out.push({id:`vote:${v.id}`, at:v.createdAt||nowIso(), forMe:true, kind:"due", voteId:v.id, text:`Your vote is needed: <b>${esc(v.title)}</b> (closes ${fmt(new Date(v.closesAtIso).toLocaleDateString("en-CA"))})`});
  for(const c of S.contacts.filter(fuLate)) out.push({id:`fu:${c.id}:${c.followUpDate}`, at:c.followUpDate+"T08:00:00", forMe: c.byId===mine, kind:"overdue", text:`Follow-up overdue: <b>${esc(c.subject)}</b> (was due ${fmt(c.followUpDate)})`, contactId:c.id});
  for(const t of S.tasks.filter(t=>t.ownerId===mine && t.status!=="done" && t.due && daysBetween(today(), t.due) <= 2))
    out.push({id:`due:${t.id}:${t.due}`, at:(t.due < today() ? t.due : today())+"T08:00:00", forMe:true, kind:"due", text:`Your task <b>${esc(t.title)}</b> ${taskLate(t) ? `was due ${fmt(t.due)}` : t.due===today() ? "is due today" : `is due ${fmt(t.due)}`}`, taskId:t.id});
  out.sort((a,b)=>b.at.localeCompare(a.at));
  notifIndex = Object.fromEntries(out.map(n=>[n.id,n]));
  return out.slice(0, 60);
}
const isRead = n => n.own || (reads.unread[n.id] ? false : !!(reads.read[n.id] || (reads.allReadBefore && n.at <= reads.allReadBefore)));
let bellOpen = false, bellFilter = "all";
function renderBell(){
  const list = buildNotifications();
  const unread = list.filter(n=>!isRead(n)).length;
  $("#bellCount").textContent = unread > 99 ? "99+" : unread; $("#bellCount").hidden = !unread;
  $("#bellBtn").setAttribute("aria-label", `Notifications, ${unread} unread`);
  if(!bellOpen) return;
  const shown = bellFilter === "me" ? list.filter(n=>n.forMe) : bellFilter === "unread" ? list.filter(n=>!isRead(n)) : list;
  $("#bellPanel").innerHTML = `<div class="np-head"><b>Notifications</b>${unread?`<button type="button" class="link" data-act="notif-all-read">Mark all as read</button>`:""}</div>
    <div class="np-tabs" role="tablist">${[["all","All"],["unread",`Unread${unread?` (${unread})`:""}`],["me","For me"]].map(([k,l])=>`<button type="button" role="tab" aria-selected="${bellFilter===k}" data-act="notif-filter" data-f="${k}">${l}</button>`).join("")}</div>
    <div class="np-list">${shown.length ? shown.map(n => `<div class="np-item ${isRead(n)?"":"unread"} ${n.kind==="overdue"?"late":""}">
        <button type="button" class="np-main" data-act="notif-open" data-nid="${esc(n.id)}"><span class="np-dot" aria-hidden="true"></span><span class="np-text">${n.text}<span class="np-meta">${ago(n.at)}${n.mentioned?' · <span class="pill acc">@ Mentioned you</span>':n.forMe?' · <span class="pill acc">For you</span>':""}</span></span></button>
        ${n.own ? "" : `<button type="button" class="np-toggle" data-act="notif-toggle" data-nid="${esc(n.id)}" title="${isRead(n)?"Mark as unread":"Mark as read"}" aria-label="${isRead(n)?"Mark as unread":"Mark as read"}">${isRead(n)?"○":"●"}</button>`}
      </div>`).join("") : `<p class="sub" style="padding:16px;margin:0;text-align:center">${bellFilter==="unread"?"You're all caught up.":"Nothing here yet."}</p>`}</div>`;
}
function markRead(id, read){
  if(read){ reads.read[id] = true; delete reads.unread[id]; }
  else { reads.unread[id] = true; delete reads.read[id]; }
  saveReads();
}
function toggleBell(open){
  bellOpen = open === undefined ? !bellOpen : open;
  $("#bellPanel").hidden = !bellOpen; $("#bellBtn").setAttribute("aria-expanded", bellOpen);
  renderBell();
}

}

});
document.addEventListener("change", async ev => {
  if(ev.target.dataset && ev.target.dataset.qs){
    const t = S.tasks.find(x=>x.id===ev.target.dataset.qs); const st = ev.target.value; if(!t || t.status===st) return;
    if(await store.set("tasks", t.id, {...clean(t), status:st})){ toast(`Moved to ${statusLabel(st)}`); logActivity({type:"task", text:`moved "${t.title}" to ${statusLabel(st)}`, taskId:t.id}); }
    return;
  }
  if(ev.target.dataset && ev.target.dataset.rv !== undefined){ const k = ev.target.dataset.k; if(k !== "on" && mins) mins.items[+ev.target.dataset.rv][k] = ev.target.value; return; }
  const id = ev.target.id;
  if(id==="cTradeF"){ cfilt.trade = ev.target.value; render(); return; }
  if(id==="cStatusF"){ cfilt.status = ev.target.value; render(); return; }
  if(id==="fOwner") filt.owner = ev.target.value;
  else if(id==="fCat") filt.cat = ev.target.value;
  else if(id==="fLayout") filt.layout = ev.target.value;
  else if(id==="fPm") filt.pmShow = ev.target.value;
  else return;
  saveFilters(); render();
});
$("#quickAdd").addEventListener("click", () => contactModal());

boot();
})();
</script>
</body>
</html>
